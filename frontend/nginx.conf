server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: /display, /dashboard and friends are client-side routes,
    # so any unknown path has to fall back to index.html or a TV reloading on
    # /display would get a 404 instead of the player.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The service worker must never be cached, or a TV can be pinned to an
    # old shell forever.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
